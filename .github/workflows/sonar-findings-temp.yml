name: Temporary Sonar findings PR21
on:
  push:
    branches: [feat/sonar-report-reconciliation-20261119]
permissions:
  contents: read
  checks: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Print exact Sonar findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_ID: '135262556121'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base='https://api.github.com/repos/'+os.environ['GH_REPO']
          head={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                'Accept':'application/vnd.github+json'}
          check=os.environ['CHECK_ID']
          for page in range(1,4):
              url=base+'/check-runs/'+check+'/annotations?per_page=100&page='+str(page)
              with urllib.request.urlopen(urllib.request.Request(url,headers=head),timeout=20) as r:
                  anns=json.load(r)
              for a in anns:
                  print('SONAR_FINDING:',json.dumps({
                      'path':a.get('path'),'start_line':a.get('start_line'),
                      'end_line':a.get('end_line'),'title':a.get('title'),
                      'message':a.get('message'),'annotation_level':a.get('annotation_level')
                  },ensure_ascii=False))
              if len(anns)<100:
                  break
          PY
