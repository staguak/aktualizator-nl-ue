name: Verify public updater code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-updater-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aktualizator-ph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: aktualizator-ph/.node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes --only-binary=:all: --disable-pip-version-check --index-url https://pypi.org/simple -r scripts/xml-requirements.txt -r scripts/rdf-requirements.txt -r scripts/image-requirements.txt -r scripts/workflow-requirements.txt
      - run: npm run typecheck
      - run: npm run typecheck:tools
      - run: npm run parser:selftest
      - run: npm test
      - run: npm run test:xml
      - run: npm run test:evidence
      - run: python3 -m unittest discover -s tests -p test_image_validation.py
      - run: python3 -m unittest discover -s tests -p test_distribution.py
      - run: python3 -m unittest discover -s tests -p test_sonar_security.py
      - run: python3 -m unittest discover -s tests -p test_official_audit.py
      - name: Diagnose SonarCloud PR 13 new-code security findings (temporary)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 13
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          params=urllib.parse.urlencode({'projects':'staguak_aktualizator-nl-ue','pullRequest':'13','ps':500})
          url='https://sonarcloud.io/api/issues/search?'+params
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'PublicUpdater-Sonar-Audit/1.0'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  obj=json.load(response)
              print('SONAR_ISSUE_TOTAL',obj.get('total'))
              for issue in obj.get('issues',[]):
                  comp=issue.get('component','')
                  print('SONAR_ISSUE',issue.get('key'),issue.get('rule'),comp,issue.get('line'),
                        issue.get('severity'),issue.get('type'),issue.get('message','')[:260])
          except Exception as exc:
              print('SONAR_API_DIAGNOSTIC_FAILED',type(exc).__name__,getattr(exc,'code',''))
          PY
      - name: Verify public publication, admission, diagnostics and notification boundaries
        run: python3 -m unittest discover -s tests -p 'test_public_*.py'
