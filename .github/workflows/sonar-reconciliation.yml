name: SonarCloud - kontrola brakujących raportów

on:
  # Each commit pushed to main runs Verify public updater code.
  # Reconcile only when that push-triggered verification finishes.
  # There is no periodic polling or manual trigger.
  workflow_run:
    workflows:
      - Verify public updater code
    types: [completed]

permissions:
  contents: read

jobs:
  reconcile_discover:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      checks: ${{ steps.find.outputs.checks }}
    steps:
      - name: Fetch trusted reconciliation scripts
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['WORKFLOW_SHA']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
              raise ValueError('Invalid repository')
          if not re.fullmatch(r'[a-fA-F0-9]{40}', sha):
              raise ValueError('Invalid trusted workflow SHA')
          for file in ('export_run_reports.py', 'sonar_reconcile.py'):
              url = f'https://api.github.com/repos/{repo}/contents/aktualizator-ph/scripts/{file}?ref={sha}'
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'aktualizator-sonar-reconcile'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              if payload.get('encoding') != 'base64' or payload.get('type') != 'file':
                  raise ValueError('Unexpected script response')
              contents = base64.b64decode(''.join(payload['content'].split()), validate=True)
              with open(file, 'wb') as target:
                  target.write(contents)
          PY
      - name: Discover missing completed SonarCloud checks
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 sonar_reconcile.py

  archive_missing:
    permissions:
      contents: read
      checks: read
    needs: reconcile_discover
    if: needs.reconcile_discover.outputs.checks != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        check: ${{ fromJSON(needs.reconcile_discover.outputs.checks) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Initialize failure evidence
        run: |
          mkdir -p github-reports
          echo '{"status":"incomplete","reason":"check export did not complete; inspect logs"}' > github-reports/export-incomplete.json
      - name: Fetch trusted report exporter
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request
          repo, sha = os.environ['GITHUB_REPOSITORY'], os.environ['WORKFLOW_SHA']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
              raise ValueError('Invalid repository')
          if not re.fullmatch(r'[a-fA-F0-9]{40}', sha):
              raise ValueError('Invalid trusted workflow SHA')
          url = f'https://api.github.com/repos/{repo}/contents/aktualizator-ph/scripts/export_run_reports.py?ref={sha}'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'aktualizator-sonar-reconcile'})
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          if payload.get('encoding') != 'base64' or payload.get('type') != 'file':
              raise ValueError('Unexpected script response')
          contents = base64.b64decode(''.join(payload['content'].split()), validate=True)
          with open('export_run_reports.py', 'wb') as target:
              target.write(contents)
          PY
      - name: Export verified missing SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_RECONCILE_CHECK_ID: ${{ matrix.check.id }}
        run: python3 export_run_reports.py
      - name: Remove fallback after successful export
        if: success()
        run: rm -f github-reports/export-incomplete.json
      - name: Archive recovered SonarCloud check
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-check-${{ matrix.check.id }}
          path: github-reports/
          retention-days: 90
          if-no-files-found: error
      - name: Save failure diagnostics without pretending the check was archived
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-reconcile-error-${{ matrix.check.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: github-reports/
          retention-days: 90
          if-no-files-found: error
